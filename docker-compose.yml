services:
  app:
    build: .
    container_name: ${APP_NAME:-mailys}-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3007}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
